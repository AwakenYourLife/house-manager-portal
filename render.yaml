# Render Blueprint for the house manager portal.
#
# Pointing Render at this repository creates the service from here, so nothing
# is typed into a form from memory.
services:
  - type: web
    name: house-manager-portal
    runtime: node
    region: ohio
    branch: main

    # Always on. The free tier sleeps after ~15 quiet minutes and the next
    # visitor waits ~50 seconds — a manager trying to clock in at 8am would
    # read that as the site being down.
    plan: starter

    # src/generated/prisma is not committed, so the client is generated here.
    buildCommand: npm ci && npx prisma generate && npm run build
    # Migrations are NOT run here. A preDeployCommand running
    # `prisma migrate deploy` failed on Render (exit 1) while the same command
    # succeeded from a Mac against the same database, and a failed pre-deploy
    # blocks every deploy. Same rule as the support console: apply migrations
    # deliberately, from a machine, before pushing code that needs them.
    startCommand: node dist/server/entry.mjs
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: HOUSE_TZ
        value: America/New_York
      # Secrets: Render asks for each when the service is created.
      - key: DATABASE_URL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
